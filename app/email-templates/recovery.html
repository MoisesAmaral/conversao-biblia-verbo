<!-- Cole isto em: Supabase → Authentication → Email Templates → "Reset Password" -->
<!-- Assunto sugerido: Redefinir sua senha — Bíblia Verbo -->
<div style="background-color:#0a0a0d;padding:40px 20px;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;border-collapse:collapse;">
    <tr>
      <td style="padding-bottom:28px;text-align:center;">
        <div style="display:inline-block;width:56px;height:56px;border-radius:16px;background-color:#8257e5;background:linear-gradient(135deg,#8257e5,#6842c2);line-height:56px;font-size:26px;color:#ffffff;font-weight:bold;">✦</div>
      </td>
    </tr>
    <tr>
      <td style="background-color:#131316;border:1px solid #26262b;border-radius:16px;padding:36px 32px;">
        <h1 style="margin:0 0 8px;color:#f4f4f5;font-size:20px;font-weight:700;text-align:center;">
          Redefinir sua senha
        </h1>
        <p style="margin:0 0 28px;color:#a1a1aa;font-size:14px;text-align:center;line-height:1.6;">
          Alguém (provavelmente você) pediu para redefinir a senha da sua conta na Bíblia Verbo.
        </p>
        <table role="presentation" width="100%" style="border-collapse:collapse;">
          <tr>
            <td align="center">
              <a href="{{ .ConfirmationURL }}"
                 style="display:inline-block;background-color:#8257e5;background:linear-gradient(135deg,#8257e5,#6842c2);color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:14px 32px;border-radius:999px;">
                Escolher nova senha
              </a>
            </td>
          </tr>
        </table>
        <p style="margin:28px 0 0;color:#71717a;font-size:12px;text-align:center;line-height:1.6;">
          Se você não pediu isso, pode ignorar este e-mail — sua senha continua a mesma.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding-top:24px;text-align:center;">
        <p style="margin:0;color:#52525b;font-size:11px;letter-spacing:0.05em;">
          BÍBLIA VERBO · feito pela 123devs
        </p>
      </td>
    </tr>
  </table>
</div>
